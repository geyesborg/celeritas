import com.cleanroommc.gradle.api.task.mc.RunMinecraft

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.cleanroommc.cleanroomgradle'
}

group = 'org.embeddedt'
version = rootProject.version

base {
    archivesName = 'celeritas-forge-mc12.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup('curse.maven') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' } }
        filter {
            includeGroupAndSubgroups('com.gtnewhorizons')
            includeGroupAndSubgroups('com.github.GTNewHorizons')
        }
    }
    mavenCentral()
}

configurations {
    embed
    implementation.extendsFrom(embed)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

dependencies {
    implementation cleanroom.userdev('0.6.10') {
        accessTransformers.from(layout.projectDirectory.file('src/main/resources/META-INF/celeritas_at.cfg'))
    }

    // common stays upstream-shaped (Java 17 bytecode is fine on a Java 25 runtime);
    // its classes are unpacked into this jar like upstream's shadowRemapJar does.
    implementation project(':common')
    embed(project(':common')) { transitive = false }

    // joml is embedded unrelocated; upstream relocates it to impl.shadow.joml only to
    // avoid classpath duplication, which is unnecessary here.
    implementation 'org.joml:joml:1.10.5'
    embed('org.joml:joml:1.10.5') { transitive = false }

    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    // mixin API surface for compilation; Cleanroom ships mixinbooter at runtime
    compileOnly 'zone.rong:mixinbooter:10.5'

    // @Jabel annotations are referenced by source; no Jabel bytecode rewriting
    // is needed at Java 25 (upstream uses it to emit Java 8 bytecode).
    compileOnly 'com.github.GTNewHorizons:jabel-javac-plugin:1.0.2-GTNH'

    // compileOnly: CeleritasVintageMixinPlugin probes for RFB classes at runtime.
    compileOnly('com.gtnewhorizons.retrofuturabootstrap:RetroFuturaBootstrap:1.0.11') {
        exclude group: 'org.apache.logging.log4j'
    }

    // upstream runs dev against AE2; it crashes on Cleanroom (AppEng.<init> mismatch)
    modCompileOnly 'maven.modrinth:fluidlogged-api:3.0.6'
}

def modVersion = version
processResources {
    inputs.property 'version', modVersion
    filesMatching('mcmod.info') {
        expand 'version': modVersion
    }
    from(rootProject.file('modern/src/main/resources/icon.png'))
}

jar {
    archiveClassifier = 'dev'
    dependsOn ':common:jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(provider { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/versions/**'
    }
    manifest {
        attributes(
                'FMLAT': 'celeritas_at.cfg',
                'FMLCorePlugin': 'org.taumc.celeritas.core.CeleritasLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'ModType': 'CRL',
                'Lwjgl3-Aware': true,
                'Lwjgl3ify-Aware': true
        )
    }
    finalizedBy(tasks.named('reobfJar'))
}

tasks.named('reobfJar').configure {
    archiveClassifier.set('')
}

tasks.register('prepareCeleritasRun', Copy) {
    dependsOn(tasks.named('jar'))
    from(tasks.named('jar').flatMap { it.archiveFile })
    def modsDir = layout.projectDirectory.dir('run/cleanroom-client/mods').asFile
    into(modsDir)
    doFirst {
        // The jar name is git-derived and changes between builds; stale copies
        // would register as duplicate mods in FML.
        modsDir.listFiles({ d, n -> n.startsWith('celeritas-') && n.endsWith('.jar') })
                ?.each { it.delete() }
    }
}

tasks.withType(RunMinecraft).configureEach {
    dependsOn(tasks.named('jar'))
    if (name == 'runClient') {
        dependsOn(tasks.named('prepareCeleritasRun'))
        workingDir(layout.projectDirectory.dir('run/cleanroom-client'))
        jvmArgs '--enable-native-access=ALL-UNNAMED',
                '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED'
        // Mirrors gl46core: -Pextra_jvm_args="-Dfoo=bar -Dbaz=quux" reaches the client JVM.
        def extraArgs = findProperty('extra_jvm_args')
        if (extraArgs != null && !extraArgs.toString().trim().isEmpty()) {
            jvmArgs(*extraArgs.toString().trim().split('\\s+'))
        }
        def classesDir = layout.buildDirectory.dir('classes/java/main')
        def resourcesDir = layout.buildDirectory.dir('resources/main')
        // Computed at configuration time: file() inside doFirst is unsupported
        // with the configuration cache.
        def kirinoCfg = file('run/cleanroom-client/config/kirino_engine.cfg')
        doFirst {
            // Kill any stale dev client still running: a live process keeps the
            // session/lock and pollutes latest.log. Matched on command line, never
            // window title (background/killed-window clients have no title).
            def killCmd = "Get-CimInstance Win32_Process | Where-Object { \$_.Name -like 'java*' -and \$_.CommandLine -like '*cleanroom-client*' } | ForEach-Object { Write-Host ('[runClient] killing stale client PID ' + \$_.ProcessId); Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
            try {
                def killProc = new ProcessBuilder('powershell', '-NoProfile', '-Command', killCmd)
                        .redirectErrorStream(true).start()
                killProc.inputStream.eachLine { logger.lifecycle(it) }
                killProc.waitFor()
            } catch (Exception e) {
                logger.warn('[runClient] stale-client kill failed: {}', e.toString())
            }
            // Match production: Cleanroom's Kirino engine stays OFF in dev.
            kirinoCfg.parentFile.mkdirs()
            if (kirinoCfg.exists()) {
                def t = kirinoCfg.text
                t = t.replaceAll(/B:enable=\w+/, 'B:enable=false')
                t = t.replaceAll(/B:enableRenderDelegate=\w+/, 'B:enableRenderDelegate=false')
                t = t.replaceAll(/B:enableHDR=\w+/, 'B:enableHDR=false')
                kirinoCfg.text = t
            } else {
                kirinoCfg.text = 'B:enable=false\nB:enableRenderDelegate=false\nB:enableHDR=false\n'
            }
            classpath = classpath.filter {
                !it.canonicalPath.equals(classesDir.get().asFile.canonicalPath) &&
                        !it.canonicalPath.equals(resourcesDir.get().asFile.canonicalPath) &&
                        !it.name.startsWith('common-') &&
                        !it.name.startsWith('patchy-')
            }
        }
    }
}
